<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680">
<title>Flysnapper 0.1.0 front-view proposal</title>
<desc>Illustrative GUI sketch, not an Ableton screenshot or detector test. Example chord Bm7 and B Dorian. Actual implemented window has a flip button to a scrolling 50-row scale table.</desc>
<rect width="900" height="680" fill="#141b22"/>
<g font-family="sans-serif" fill="#edf2f5">
<text x="24" y="49" font-size="31" font-weight="bold">FLYSNAPPER</text>
<text x="295" y="45" font-size="13" fill="#9badbb">by Olav Lægreid</text>
<text x="24" y="80" font-size="12" font-weight="bold" fill="#ffb15d">0.1.0 / ROUTING + MIDI PROTOTYPE</text>
<g fill="#1d2731" stroke="#344351"><rect x="672" y="25" width="204" height="32" rx="5"/><rect x="24" y="104" width="852" height="207" rx="10"/><rect x="24" y="329" width="417" height="264" rx="10"/><rect x="459" y="329" width="417" height="264" rx="10"/><rect x="804" y="623" width="72" height="28" rx="5"/></g>
<text x="774" y="46" text-anchor="middle" font-size="14">Chord / scale setup</text>
<text x="48" y="175" font-size="44" font-weight="bold">Bm7</text>
<text x="48" y="214" font-size="18" fill="#58d7bb">B Dorian</text>
<text x="48" y="244" font-size="13" fill="#9badbb">Chord control: channel 16</text>
<text x="48" y="282" font-size="12" fill="#9badbb">ALLOWED NOTES</text>
<g font-size="15" text-anchor="middle">
<g fill="#141b22"><rect x="178" y="261" width="50" height="29"/><rect x="346" y="261" width="50" height="29"/><rect x="458" y="261" width="50" height="29"/><rect x="570" y="261" width="50" height="29"/><rect x="738" y="261" width="50" height="29"/></g>
<g fill="#2b4e4b"><rect x="234" y="261" width="50" height="29"/><rect x="290" y="261" width="50" height="29"/><rect x="402" y="261" width="50" height="29"/><rect x="514" y="261" width="50" height="29"/><rect x="626" y="261" width="50" height="29"/><rect x="682" y="261" width="50" height="29"/><rect x="794" y="261" width="50" height="29"/></g>
<text x="203" y="282" fill="#9badbb">C</text><text x="259" y="282">Db</text><text x="315" y="282">D</text><text x="371" y="282" fill="#9badbb">Eb</text><text x="427" y="282">E</text><text x="483" y="282" fill="#9badbb">F</text><text x="539" y="282">F#</text><text x="595" y="282" fill="#9badbb">G</text><text x="651" y="282">Ab</text><text x="707" y="282">A</text><text x="763" y="282" fill="#9badbb">Bb</text><text x="819" y="282">B</text>
</g>
<text x="58" y="370" fill="#5daeff" font-size="16" font-weight="bold">1 PITCH TO MIDI</text>
<text x="493" y="370" fill="#ffb15d" font-size="16" font-weight="bold">2 MIDI TO MIDI</text>
<text x="50" y="404" font-size="15">Audio detection not yet implemented.</text>
<text x="50" y="427" font-size="15">Mono and poly detection remain development work.</text>
<g font-size="13" fill="#9badbb"><text x="50" y="465">Sidechain bus disabled</text><text x="50" y="506">Routing test: MIDI 60 / 100 ms</text><text x="50" y="526">Uses the same correction as incoming keyboard notes.</text></g>
<rect x="50" y="545" width="150" height="30" rx="5" fill="#1d2731" stroke="#344351"/><text x="125" y="565" font-size="14" text-anchor="middle">Send test note</text>
<text x="485" y="405" font-size="14">✓ Correction enabled</text>
<g font-size="12" fill="#9badbb"><text x="485" y="444">MODE</text><text x="485" y="489">FIXED ROOT</text><text x="593" y="489">FIXED SCALE</text></g>
<g fill="#141b22" stroke="#344351"><rect x="561" y="420" width="289" height="30" rx="3"/><rect x="485" y="494" width="90" height="31" rx="3"/><rect x="593" y="494" width="257" height="31" rx="3"/></g>
<text x="572" y="441" font-size="14">Chord Scale</text><text x="498" y="515" font-size="14" fill="#9badbb">C</text><text x="605" y="515" font-size="14" fill="#9badbb">Major / Ionian</text>
<text x="485" y="568" fill="#58d7bb" font-size="13">MIDI output: active</text>
<line x1="24" y1="611" x2="876" y2="611" stroke="#344351"/>
<text x="24" y="640" fill="#ffb15d" font-size="13">MPE must be OFF. Channel 16 is reserved for chord control.</text>
<text x="840" y="642" font-size="14" text-anchor="middle">Panic</text>
<text x="24" y="663" fill="#9badbb" font-size="11">AGPL-3.0-or-later / No warranty / See LICENSE.txt</text>
</g>
</svg>
